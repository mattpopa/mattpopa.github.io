baseURL: "https://cloudcat.digital/"
title: "CloudCat Digital"
theme: PaperMod

pagination:
  pagerSize: 8

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: CloudCat Digital
  description: "DevOps and platform engineering for product teams: AWS, Kubernetes, CI/CD, cloud cost, security and compliance. Based in Bucharest, working remotely with teams across the UK and EU."
  keywords:
    - "DevOps consultancy"
    - "Platform engineering"
    - "Kubernetes"
    - "EKS"
    - "AWS"
    - "Azure"
    - "Terraform"
    - "GitHub Actions"
    - "CI/CD"
    - "SRE"
    - "Cloud cost"
    - "ISO 27001"
    - "Observability"
    - "HashiCorp Vault"
    - "Bucharest"
  author: Matei Popa
  images: ["/images/logo_text_small_cloudcat_digital.webp"]
  DateFormat: "2 January 2006"
  defaultTheme: light
  disableThemeToggle: false
  mainSections:
    - posts

  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/safari-pinned-tab.svg"

  label:
    text: "CloudCat Digital"
    icon: /images/logo_mark_small.webp
    iconHeight: 32
    iconWidth: 32

  profileMode:
    enabled: false

  socialIcons:
    - name: "github"
      url: "https://github.com/mattpopa"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/matei-popa-devops/"

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  showtoc: true
  tocopen: false
  disableSpecial1stPost: true
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false

  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: services
      name: Services
      url: /#services
      weight: 10
    - identifier: blog
      name: Blog
      url: /posts/
      weight: 20
    - identifier: about
      name: About
      url: /about/
      weight: 30
    - identifier: contact
      name: Contact
      url: /contact/
      weight: 40

pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
