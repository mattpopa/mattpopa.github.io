{{- define "main" }}
<div class="cc-wide cc-contact">
  <header class="page-header">
    <p class="cc-eyebrow">Contact</p>
    <h1>{{ .Title }}</h1>
  </header>

  <div class="cc-contact-grid">
    <div class="cc-contact-intro post-content md-content">
      {{ .Content }}
      <p class="cc-contact-alt">
        Prefer another channel?
        <a href="https://www.linkedin.com/in/matei-popa-devops/" rel="me noopener" target="_blank">LinkedIn</a>
        &middot;
        <a href="https://github.com/mattpopa" rel="me noopener" target="_blank">GitHub</a>
      </p>
    </div>

    <div class="cc-contact-form-wrap">
      <form id="contact-form" class="cc-form" action="https://formspree.io/f/mayvdeee" method="POST">
        <input type="hidden" name="_subject" value="New enquiry via cloudcat.digital">
        <input type="text" name="_gotcha" class="cc-gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">

        <label>
          <span class="cc-label">Name</span>
          <input type="text" name="name" autocomplete="name" required>
        </label>
        <label>
          <span class="cc-label">Email</span>
          <input type="email" name="email" autocomplete="email" placeholder="you@company.com" required>
        </label>
        <label>
          <span class="cc-label">Company <small class="cc-optional">(optional)</small></span>
          <input type="text" name="company" autocomplete="organization">
        </label>
        <label>
          <span class="cc-label">What are you working on?</span>
          <textarea name="message" rows="6" required placeholder="A few lines about your platform and what is getting in the way."></textarea>
        </label>

        <div class="cc-captcha">
          <div id="contact-captcha-holder" class="cc-captcha-frame"></div>
        </div>
        <p id="contact-hint" class="cc-form-error" hidden>Please tick the captcha first.</p>

        <div class="cc-form-actions">
          <button type="submit" class="cc-btn cc-btn-primary">Send message</button>
          <span class="cc-form-note">We reply within one business day.</span>
        </div>
      </form>

      <div id="contact-thanks" class="cc-form cc-thanks" hidden>
        <h2>Thanks, message received.</h2>
        <p>We will get back to you within one business day.</p>
      </div>
    </div>
  </div>
</div>

<script>
  (function () {
    // reCAPTCHA is rendered explicitly so it can follow the site theme,
    // and re-rendered when the visitor toggles light/dark.
    var SITE_KEY = '6LfFldgSAAAAAKZsuk4ejWF3ng4Q-WMrvh5NF3Ty';
    var widgetId = null;
    function theme() {
      return document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
    }
    function renderCaptcha() {
      var holder = document.getElementById('contact-captcha-holder');
      if (!holder || !window.grecaptcha || typeof grecaptcha.render !== 'function') return;
      holder.innerHTML = '<div id="contact-captcha"></div>';
      widgetId = grecaptcha.render('contact-captcha', { sitekey: SITE_KEY, theme: theme() });
    }
    window.ccCaptchaInit = renderCaptcha;
    var toggle = document.getElementById('theme-toggle');
    if (toggle) {
      toggle.addEventListener('click', function () { setTimeout(renderCaptcha, 0); });
    }

    var form = document.getElementById('contact-form');
    if (!form || !window.fetch) return;
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var hint = document.getElementById('contact-hint');
      if (widgetId !== null && !grecaptcha.getResponse(widgetId)) {
        hint.hidden = false;
        return;
      }
      hint.hidden = true;
      var btn = form.querySelector('button[type=submit]');
      btn.disabled = true;
      btn.textContent = 'Sending…';
      fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      }).then(function (r) {
        if (!r.ok) throw new Error('status ' + r.status);
        form.hidden = true;
        document.getElementById('contact-thanks').hidden = false;
      }).catch(function () {
        // Inline submit refused (e.g. captcha required on the Formspree side):
        // fall back to a normal form post, which Formspree handles on its own page.
        btn.disabled = false;
        btn.textContent = 'Send message';
        form.submit();
      });
    });
  })();
</script>
<script src="https://www.google.com/recaptcha/api.js?onload=ccCaptchaInit&render=explicit" async defer></script>
{{- end }}
